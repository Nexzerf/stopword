:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #18213a; --ink: #e8eefc; --muted: #9eabc9; --line: #2c3a5e;
    --stop: #ef4249; --sel: #6d95ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #18213a; --ink: #e8eefc; --muted: #9eabc9; --line: #2c3a5e;
  --stop: #ef4249; --sel: #6d95ff; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; align-items: center; gap: 10px; }
.sign {
  width: 40px; height: 40px; flex: none; background: var(--stop); color: var(--stop-ink);
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 9px;
}
h1 { font-family: var(--font-head); font-weight: 600; font-size: 20px; line-height: 1.2; margin: 0; }
h1 span { font-family: var(--font-display); font-weight: 400; color: var(--stop); }

.step { font-family: var(--font-head); font-weight: 500; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }

.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.cat {
  padding: 6px 4px; min-height: 48px; border-radius: 10px; line-height: 1.2;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-bottom-width: 4px;
  display: grid; place-content: center; text-align: center;
}
.cat b { font-weight: 600; font-size: 15px; }
.cat small { display: block; font-size: 11px; color: var(--muted); }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cat[aria-pressed="true"] small { color: var(--bg); opacity: .75; }

.letters { display: grid; grid-template-columns: repeat(13, 1fr); gap: 5px; }
@media (max-width: 640px) { .letters { grid-template-columns: repeat(9, 1fr); } }
.letter {
  font-family: var(--font-display); font-size: 20px; min-height: 46px; padding: 0;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 10px;
}
.letter:active, .cat:active { transform: translateY(2px); border-bottom-width: 2px; }
.letter[aria-pressed="true"] { background: var(--stop); color: var(--stop-ink); border-color: var(--stop); }

.answer {
  background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px;
  padding: 14px 16px; display: grid; gap: 10px; min-height: 150px;
}
.answer .what { margin: 0; color: var(--muted); font-size: 14px; }
.answer .what strong { color: var(--ink); }
.best {
  justify-self: start; max-width: 100%; font-family: var(--font-head); font-weight: 600;
  font-size: clamp(30px, 8vw, 44px); line-height: 1.1; padding: 8px 18px; border-radius: 12px;
  background: var(--stop); color: var(--stop-ink); border: 0; border-bottom: 5px solid color-mix(in srgb, var(--stop) 60%, #000);
  overflow-wrap: anywhere; text-align: left;
}
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.more { display: flex; flex-wrap: wrap; gap: 6px; }
.word {
  font-weight: 500; font-size: 16px; padding: 6px 12px; min-height: 40px; border-radius: 9px;
  background: transparent; color: var(--ink); border: 2px solid var(--line);
}
.word:hover { border-color: var(--ink); }
.copied { outline: 3px solid var(--sel); outline-offset: 2px; }
.none { margin: 0; color: var(--muted); }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; padding-block: 6px; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row > span { font-weight: 600; font-size: 14px; }
.row .more { min-width: 0; }
footer { color: var(--muted); font-size: 12px; }
kbd { font-family: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 500; z-index: 5;
}

    M: "Mouth, Muscle",
    N: "Nose, Neck, Nail",
    P: "Palm",
    R: "Rib",
    S: "Skin, Skull, Stomach, Shoulder",
    T: "Toe, Thumb, Tooth, Tongue",
    U: "Uvula",
    V: "Vein",
    W: "Waist, Wrist",
  },
  clothes: {
    A: "Apron, Anorak",
    B: "Belt, Boots, Blouse, Bikini",
    C: "Cap, Coat, Cardigan",
    D: "Dress",
    E: "Earmuffs",
    F: "Flip Flops",
    G: "Gown, Gloves",
    H: "Hat, Hoodie",
    J: "Jeans, Jacket, Jumper",
    K: "Kilt, Kimono",
    L: "Leggings",
    M: "Mittens",
    N: "Necktie, Nightgown",
    O: "Overalls",
    P: "Pants, Pajamas",
    R: "Robe, Raincoat",
    S: "Sock, Shirt, Shoes, Skirt, Scarf, Shorts, Sweater",
    T: "Tie, T-shirt, Tuxedo, Tank Top",
    U: "Uniform",
    V: "Vest",
    W: "Wetsuit",
    Y: "Yukata",
  },
};

const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const typed = w => w.replace(/[^A-Za-z]/g, "").length;
// Shortest first: fewer keys to type in a duel.
function words(cat, L) {
  const list = (WORDS[cat]?.[L] || "").split(",").map(w => w.trim()).filter(Boolean);
  return [...new Set(list)].sort((a, b) => typed(a) - typed(b) || a.localeCompare(b));
}

const store = {
  get(k, d) { try { return localStorage.getItem("swd:" + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("swd:" + k, v); } catch {} },
};
const state = { cat: store.get("cat2", "animal"), letter: store.get("letter", "A") };
if (!CATS.some(c => c.key === state.cat)) state.cat = "animal";
if (!LETTERS.includes(state.letter)) state.letter = "A";

const $ = id => document.getElementById(id);
const catsEl = $("cats"), lettersEl = $("letters"), answerEl = $("answer");

for (const c of CATS) {
  const b = document.createElement("button");
  b.className = "cat"; b.type = "button"; b.dataset.k = c.key;
  b.innerHTML = `<b></b><small></small>`;
  b.querySelector("b").textContent = c.th;
  b.querySelector("small").textContent = c.en;
  b.addEventListener("click", () => { state.cat = c.key; store.set("cat2", c.key); render(); });
  catsEl.appendChild(b);
}
for (const L of LETTERS) {
  const b = document.createElement("button");
  b.className = "letter"; b.type = "button"; b.textContent = L; b.dataset.l = L;
  b.addEventListener("click", () => setLetter(L));
  lettersEl.appendChild(b);
}

function wordButton(w, cls) {
  const b = document.createElement("button");
  b.type = "button"; b.className = cls; b.textContent = w;
  b.addEventListener("click", () => copy(w, b));
  return b;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

let bestWord = null;
function render() {
  catsEl.querySelectorAll(".cat").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === state.cat)));
  lettersEl.querySelectorAll(".letter").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === state.letter)));
  answerEl.innerHTML = "";
  bestWord = null;
  const L = state.letter;

  if (state.cat === "all") {
    const what = el("p", "what");
    what.innerHTML = `ทุกหมวด ขึ้นต้นด้วย <strong></strong> · แตะคำเพื่อคัดลอก`;
    what.querySelector("strong").textContent = L;
    answerEl.appendChild(what);
    const box = el("div");
    for (const c of CATS) {
      if (c.key === "all") continue;
      const row = el("div", "row");
      row.appendChild(el("span", null, c.th));
      const more = el("div", "more");
      const list = words(c.key, L).slice(0, 3);
      if (!list.length) more.appendChild(el("p", "none", "—"));
      for (const w of list) more.appendChild(wordButton(w, "word"));
      row.appendChild(more);
      box.appendChild(row);
    }
    answerEl.appendChild(box);
    return;
  }

  const cat = CATS.find(c => c.key === state.cat);
  const list = words(cat.key, L);
  const what = el("p", "what");
  what.innerHTML = `<strong></strong> ขึ้นต้นด้วย <strong></strong>`;
  const s = what.querySelectorAll("strong");
  s[0].textContent = `${cat.th} (${cat.en})`; s[1].textContent = L;
  answerEl.appendChild(what);

  if (!list.length) {
    answerEl.appendChild(el("p", "none", `ยังไม่มีคำ${cat.th}ที่ขึ้นต้นด้วย ${L} ในคลัง ตัวนี้หายาก ลองนึกคำเองหรือข้ามรอบนี้`));
    return;
  }
  bestWord = list[0];
  answerEl.appendChild(wordButton(list[0], "best"));
  answerEl.appendChild(el("p", "hint", "แตะเพื่อคัดลอก · คำสั้นสุด พิมพ์ได้เร็วสุด"));
  if (list.length > 1) {
    const more = el("div", "more");
    for (const w of list.slice(1)) more.appendChild(wordButton(w, "word"));
    answerEl.appendChild(more);
  }
}

function setLetter(L) {
  state.letter = L; store.set("letter", L); render();
  const r = answerEl.getBoundingClientRect();
  if (r.top < 0 || r.top > innerHeight - 160) {
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    answerEl.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  }
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1300);
}
function copy(word, node) {
  const done = () => {
    if (node) { node.classList.add("copied"); setTimeout(() => node.classList.remove("copied"), 600); }
    toast(`คัดลอก “${word}” แล้ว`);
  };
  const fallback = () => toast(`คัดลอกอัตโนมัติไม่ได้ พิมพ์ “${word}” เองนะ`);
  try { navigator.clipboard.writeText(word).then(done, fallback); } catch { fallback(); }
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (k.length === 1 && LETTERS.includes(k)) setLetter(k);
  else if (e.key === "Enter" && bestWord && e.target === document.body) copy(bestWord, answerEl.querySelector(".best"));
});

render();
</script>
</body>
</html>
