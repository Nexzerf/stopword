<style>
/* Layout: game-show board. Big letter tiles on top, category tabs, then word chips grouped by category. */
:root {
  --bg: #eef3fb;

  --line: #c9d4e8;

  --stop-ink: #ffffff;
  --sel: #1d4fd8;
  --animal: #2f8f3a;
  --food: #c76a00;
  --color: #9b2fc2;
  --object: #1f6fb8;
  --place: #c4245a;
  --font-display: "Bungee", "Mitr", system-ui, sans-serif;
  --font-head: "Mitr", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #18213a; --ink: #e8eefc; --muted: #9eabc9; --line: #2c3a5e;
    --stop: #ef4249; --sel: #6d95ff;
    --animal: #5cc46a; --food: #f0a03a; --color: #c27ae6; --object: #5ea9f0; --place: #f06a95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #18213a; --ink: #e8eefc; --muted: #9eabc9; --line: #2c3a5e;
  --stop: #ef4249; --sel: #6d95ff;
  --animal: #5cc46a; --food: #f0a03a; --color: #c27ae6; --object: #5ea9f0; --place: #f06a95;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.sign {
  width: 64px; height: 64px; flex: none; background: var(--stop); color: var(--stop-ink);
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 15px; letter-spacing: .02em;
}
.titles { min-width: 0; flex: 1 1 260px; }
h1 { font-family: var(--font-head); font-weight: 600; font-size: clamp(22px, 4vw, 30px); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 span { font-family: var(--font-display); font-weight: 400; color: var(--stop); }
.sub { margin: 4px 0 0; color: var(--muted); }
.search { flex: 1 1 240px; position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 12px;
  border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); color: var(--ink);
}
.search input:focus-visible { outline: none; border-color: var(--sel); }

.letters { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; }
@media (max-width: 640px) { .letters { grid-template-columns: repeat(7, 1fr); } }
.letter {
  font-family: var(--font-display); font-size: 20px; padding: 8px 0; min-height: 46px;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-bottom-width: 4px;
  border-radius: 10px; cursor: pointer; transition: transform .08s;
}
.letter:active { transform: translateY(2px); border-bottom-width: 2px; }
.letter[aria-pressed="true"] { background: var(--stop); color: var(--stop-ink); border-color: var(--stop); filter: saturate(1.1); }
.letter:focus-visible, .tab:focus-visible, .tool:focus-visible, .word:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab, .tool {
  font: inherit; font-weight: 500; padding: 7px 13px; border-radius: 999px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-height: 40px;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; font-size: 13px; }
.tools { display: flex; gap: 6px; }

.board { display: grid; gap: 14px; }
.big { display: flex; align-items: baseline; gap: 12px; }
.big b { font-family: var(--font-display); font-weight: 400; font-size: 56px; line-height: 1; color: var(--stop); }
.big p { margin: 0; color: var(--muted); }
.cat { background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; padding: 14px 16px; }
.cat h2 { margin: 0 0 10px; font-family: var(--font-head); font-weight: 500; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.cat h2::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.cat h2 small { font-family: var(--font-body); color: var(--muted); font-weight: 400; font-size: 13px; }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.word {
  font: inherit; font-weight: 500; padding: 5px 11px; border-radius: 8px; cursor: pointer; min-height: 36px;
  background: transparent; color: var(--ink); border: 2px solid color-mix(in srgb, var(--c) 45%, transparent);
}
.word:hover { background: color-mix(in srgb, var(--c) 14%, transparent); }
.word .len { font-size: 11px; color: var(--muted); margin-left: 5px; font-variant-numeric: tabular-nums; }
.word.copied { background: var(--c); color: #fff; border-color: var(--c); }
.word.copied .len { color: #fff; }
.none { color: var(--muted); margin: 0; }
.hit { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; max-width: 70ch; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 500;
}
@media (prefers-reduced-motion: reduce) { .letter { transition: none; } }
</style>

<div class="wrap">

      <p class="sub">เลือกตัวอักษรที่สุ่มได้ แล้วหยิบคำไปพิมพ์ให้ทัน แตะคำเพื่อคัดลอก</p>

  <footer>เคล็ดลับ: กดปุ่มตัวอักษรบนคีย์บอร์ดเพื่อกระโดดไปตัวนั้นได้เลย คำสั้นพิมพ์เร็วกว่า จึงเรียงสั้นก่อนเป็นค่าเริ่มต้น รายการคำที่เกมยอมรับอาจต่างกันไปบ้าง โดยเฉพาะหมวด Color และตัวอักษรยากอย่าง Q, U, X, Z</footer>
</div>

<script>
const CATS = [

const LETTERS = Object.keys(RAW);
const DATA = {};
for (const L of LETTERS) {
  DATA[L] = {};
  CATS.forEach((c, i) => {
    DATA[L][c.key] = [...new Set(RAW[L][i].split(",").map(w => w.trim()).filter(Boolean))];
  });
}

const store = {
  get(k, d) { try { const v = localStorage.getItem("swd:" + k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("swd:" + k, v); } catch {} },
};
const state = {
  letter: LETTERS.includes(store.get("letter", "A")) ? store.get("letter", "A") : "A",
  cat: store.get("cat", "all"),
  sort: store.get("sort", "short"),
  q: "",
};
if (state.cat !== "all" && !CATS.some(c => c.key === state.cat)) state.cat = "all";

const $ = id => document.getElementById(id);
const lettersEl = $("letters"), tabsEl = $("tabs"), boardEl = $("board");

LETTERS.forEach(L => {
  const b = document.createElement("button");
  b.className = "letter"; b.type = "button"; b.textContent = L; b.dataset.l = L;
  b.addEventListener("click", () => setLetter(L));
  lettersEl.appendChild(b);
});

function sortWords(list) {
  const s = [...list];
  s.sort((a, b) => state.sort === "short" ? a.length - b.length || a.localeCompare(b) : a.localeCompare(b));
  return s;
}

function renderTabs() {
  tabsEl.innerHTML = "";
  const counts = CATS.map(c => DATA[state.letter][c.key].length);
  const items = [{ key: "all", label: "ทั้งหมด", n: counts.reduce((a, b) => a + b, 0) },
    ...CATS.map((c, i) => ({ key: c.key, label: c.label, n: counts[i] }))];
  for (const it of items) {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(state.cat === it.key));
    b.innerHTML = `${it.label}<span class="n">${state.q ? "" : it.n}</span>`;
    b.addEventListener("click", () => { state.cat = it.key; store.set("cat", it.key); render(); });
    tabsEl.appendChild(b);
  }
}

function chip(word, cat) {
  const b = document.createElement("button");
  b.className = "word"; b.type = "button";
  b.style.setProperty("--c", `var(--${cat})`);
  b.innerHTML = `<span class="selectable"></span><span class="len">${word.replace(/[^A-Za-z]/g, "").length}</span>`;
  b.firstChild.textContent = word;
  b.addEventListener("click", () => copy(word, b));
  return b;
}

function catBlock(c, words, note) {
  const sec = document.createElement("div");
  sec.className = "cat"; sec.style.setProperty("--c", `var(--${c.key})`);
  const h = document.createElement("h2");
  h.innerHTML = `${c.label} <small>${c.th} · ${words.length} คำ</small>`;
  sec.appendChild(h);
  if (note) { const p = document.createElement("p"); p.className = "hit"; p.textContent = note; sec.appendChild(p); }
  const wrap = document.createElement("div"); wrap.className = "words";
  if (!words.length) {
    const p = document.createElement("p"); p.className = "none";
    p.textContent = "ยังไม่มีคำในหมวดนี้ ลองหมวดอื่นก่อน";
    wrap.appendChild(p);
  }
  for (const w of words) wrap.appendChild(chip(w, c.key));
  sec.appendChild(wrap);
  return sec;
}

function render() {
  lettersEl.querySelectorAll(".letter").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === state.letter && !state.q)));
  $("sort").textContent = state.sort === "short" ? "เรียง: สั้นก่อน" : "เรียง: A–Z";
  renderTabs();
  boardEl.innerHTML = "";
  const cats = state.cat === "all" ? CATS : CATS.filter(c => c.key === state.cat);

  if (state.q) {
    const q = state.q.toLowerCase();
    let total = 0;
    const head = document.createElement("div"); head.className = "big";
    boardEl.appendChild(head);
    for (const c of cats) {
      const found = [];
      for (const L of LETTERS) for (const w of DATA[L][c.key]) if (w.toLowerCase().includes(q)) found.push(w);
      const words = sortWords([...new Set(found)]);
      total += words.length;
      if (words.length) boardEl.appendChild(catBlock(c, words));
    }
    head.innerHTML = `<p>ผลค้นหา “<span class="selectable"></span>” ทุกตัวอักษร · ${total} คำ</p>`;
    head.querySelector("span").textContent = state.q;
    if (!total) {
      const p = document.createElement("p"); p.className = "none";
      p.textContent = "ไม่พบคำนี้ในคลัง ลองพิมพ์ให้สั้นลง หรือลบช่องค้นหาเพื่อกลับไปเลือกตัวอักษร";
      boardEl.appendChild(p);
    }
    return;
  }

  const head = document.createElement("div"); head.className = "big";
  head.innerHTML = `<b>${state.letter}</b><p>คำที่ขึ้นต้นด้วย ${state.letter}</p>`;
  boardEl.appendChild(head);
  for (const c of cats) boardEl.appendChild(catBlock(c, sortWords(DATA[state.letter][c.key])));
}

function setLetter(L) {
  state.letter = L; store.set("letter", L);
  if (state.q) { state.q = ""; $("q").value = ""; }
  render();
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1400);
}
function copy(word, el) {
  const done = () => {
    el.classList.add("copied"); setTimeout(() => el.classList.remove("copied"), 700);
    toast(`คัดลอก “${word}” แล้ว`);
  };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(el.firstChild);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    toast("คัดลอกอัตโนมัติไม่ได้ กด Ctrl+C เพื่อคัดลอกคำที่เลือกไว้");
  };
  try { navigator.clipboard.writeText(word).then(done, fallback); } catch { fallback(); }
}

$("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
$("sort").addEventListener("click", () => { state.sort = state.sort === "short" ? "az" : "short"; store.set("sort", state.sort); render(); });
$("rand").addEventListener("click", () => setLetter(LETTERS[Math.floor(Math.random() * LETTERS.length)]));
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") { if (e.key === "Escape") { e.target.value = ""; state.q = ""; render(); } return; }
  const k = e.key.toUpperCase();
  if (k.length === 1 && LETTERS.includes(k)) { setLetter(k); }
  else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
});

render();
</script>
</body>
</html>
